services:
  # 1. FastAPI + ML Backend Service
  - type: web
    name: aegisnet-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./data/aegisnet.db
      - key: FIREWORKS_API_KEY
        sync: false
      - key: FIREWORKS_MODEL
        value: accounts/fireworks/models/llama-v3p3-70b-instruct

  # 2. React + TypeScript Cybersecurity Dashboard (Static Site)
  - type: web
    name: aegisnet-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        # Replace with your deployed backend URL + /api/v1 if configuring manually
        value: https://aegisnet-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
